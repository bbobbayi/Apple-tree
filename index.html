<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사과나무 🍎</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff4e5;color:#433226;font-family:system-ui,'Malgun Gothic',sans-serif}.wrap{max-width:520px;margin:auto;padding:16px}header,.card{background:white;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #0001}header{text-align:center}h1{margin:4px}h2{font-size:19px;margin:0 0 12px}p{line-height:1.5}nav{display:flex;gap:8px;margin-bottom:14px}button{font:inherit;border:0;border-radius:12px;padding:10px 13px;background:#f5dfc0;color:#483521;cursor:pointer}button:disabled{opacity:.5;cursor:default}.tab{flex:1}.selected,.main{background:#e74852;color:white}.main{width:100%;font-weight:700}.ok{background:#2d9754;color:white}.danger{background:#ffdddd;color:#9a2020}.entry{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;margin:8px 0;background:#fff4e5;border-radius:12px;overflow-wrap:anywhere}.entry>span{flex:1}.wait{background:#fff0bd}.approved{background:#e2f5e7}input{width:100%;font:inherit;padding:12px;margin-bottom:8px;border:1px solid #e5c799;border-radius:10px}.buttons{display:flex;gap:6px;flex-wrap:wrap}.buttons button{font-size:14px;padding:8px}.muted{color:#806b58;font-size:14px}.hidden{display:none!important}.badge{display:inline-block;background:#e5f6eb;border-radius:20px;padding:7px 10px;margin:3px;font-size:14px}.notice{background:#fff0bd;padding:12px;border-radius:12px;margin-bottom:14px}.close{background:#4a4a4a;color:white;width:100%;font-weight:700}
</style></head><body><div class="wrap"><header><div style="font-size:50px">🌳</div><h1>사과나무</h1><div id="counter"></div></header>
<div id="storageWarning" class="notice hidden"></div><nav><button id="kidTab" class="tab selected">아이 화면</button><button id="parentTab" class="tab">부모 승인</button></nav>
<section id="kid"><div class="card"><h2>오늘 할 일</h2><div id="kidTasks"></div><p class="muted">할 일을 누르면 승인 요청, 다시 누르면 요청 취소. 승인된 체크는 취소 요청을 보낼 수 있어요.</p></div><div class="card"><h2>내 배지</h2><div id="badges"></div></div><div class="card"><h2>사과로 바꾸기</h2><div id="kidRewards"></div></div></section>
<section id="parent" class="hidden"><div id="login" class="card"><h2>부모 비밀번호</h2><input id="pin" type="password" inputmode="numeric" placeholder="처음 비밀번호 1234"><button id="loginBtn" class="main">로그인</button></div><div id="parentContent" class="hidden"><div class="card"><button id="logoutBtn" class="close">🔒 부모 화면 닫기</button><p class="muted">닫으면 아이가 설정을 바꿀 수 없어요. 아이 화면으로 이동하거나 화면을 닫아도 자동으로 잠겨요.</p></div><div class="card"><h2>오늘 승인 대기 <span id="pendingCount"></span></h2><div id="pending"></div></div><div class="card"><h2>오늘 취소 요청</h2><div id="cancels"></div></div><div class="card"><h2>오늘 승인된 할 일</h2><div id="approved"></div></div><div class="card"><h2>할 일 관리</h2><input id="newTask" placeholder="새 할 일"><button id="addTask" class="main">할 일 추가</button><div id="manageTasks"></div></div><div class="card"><h2>보상 관리</h2><input id="newReward" placeholder="새 보상"><input id="newCost" type="number" min="1" value="3" placeholder="필요한 사과"><button id="addReward" class="main">보상 추가</button><div id="manageRewards"></div></div><div class="card"><h2>성공 기록</h2><div id="history"></div></div><div class="card"><h2>설정</h2><input id="newPin" type="password" placeholder="새 비밀번호 (4자리 이상)"><button id="changePin">비밀번호 변경</button><button id="reset" class="danger">모든 데이터 초기화</button></div></div></section></div>
<script>
'use strict';
const KEY='appleTreeAppV6';
const DEFAULT={tasks:[{id:'t1',name:'양치하기'},{id:'t2',name:'숙제하기'},{id:'t3',name:'장난감 정리'}],rewards:[{id:'r1',name:'아이스크림 먹기',cost:3},{id:'r2',name:'공원 놀러가기',cost:5}],days:{},badges:[],pin:'1234'};
const $=id=>document.getElementById(id);
const localDay=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const previousDay=key=>{let [y,m,d]=key.split('-').map(Number);return localDay(new Date(y,m-1,d-1))};
let storageOK=true, loggedIn=false, tab='kid';
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){storageOK=false;return null}}
function normalize(x){if(!x||typeof x!=='object')return structuredClone(DEFAULT);
let tasks=(Array.isArray(x.tasks)?x.tasks:DEFAULT.tasks).map((t,i)=>typeof t==='string'?{id:'legacy-'+i,name:t}:t).filter(t=>t&&t.id&&typeof t.name==='string');
let rewards=(Array.isArray(x.rewards)?x.rewards:DEFAULT.rewards).map((r,i)=>({...r,id:r.id||'legacy-r-'+i}));
let days=x.days&&typeof x.days==='object'?x.days:{};
if(!x.days){const dates=new Set([...Object.keys(x.pending||{}),...Object.keys(x.approved||{}),...Object.keys(x.cancelRequests||{}),...Object.keys(x.records||{})]);for(const date of dates){const ids=a=>(Array.isArray(a)?a:[]).map(n=>tasks[n]?.id).filter(Boolean);days[date]={pending:ids(x.pending?.[date]),approved:ids(x.approved?.[date]),cancels:ids(x.cancelRequests?.[date]),complete:!!x.records?.[date]}}}
return {tasks,rewards,days,badges:Array.isArray(x.badges)?x.badges:[],pin:String(x.pin||'1234'),legacyApples:Number(x.legacyApples??x.apples??0),legacyStreak:Number(x.legacyStreak??x.streak??0),legacyLast:x.legacyLast??x.lastSuccessDate??null};}
let data=normalize(read());
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;return true}catch(e){storageOK=false;$('storageWarning').textContent='이 브라우저에서 저장이 차단됐어요. 크롬이나 삼성 인터넷의 일반 탭으로 열어주세요.';$('storageWarning').classList.remove('hidden');return false}}
function day(key=localDay()){return data.days[key]||(data.days[key]={pending:[],approved:[],cancels:[],complete:false})}
function freshId(){return String(Date.now())+'-'+Math.random().toString(36).slice(2)}
function status(){const today=localDay();let streak=0,date=today;if(!data.days[date]?.complete)date=previousDay(date);while(data.days[date]?.complete){streak++;date=previousDay(date)}let earned=Object.values(data.days).filter(v=>v.complete).reduce((n,v)=>n+((v.rewarded)?1:0),0);let used=data.badges.reduce((n,b)=>n+Number(b.cost||0),0);return {streak,apples:Math.max(0,earned+Number(data.legacyApples||0)-used)} }
function checkDay(key=localDay()){let d=day(key);let complete=data.tasks.length>0&&data.tasks.every(t=>d.approved.includes(t.id));if(complete&&!d.complete){d.complete=true;const count=(()=>{let c=1,k=previousDay(key);while(data.days[k]?.complete){c++;k=previousDay(k)}return c})();d.rewarded=count%3===0;if(d.rewarded)alert('🎉 3일 연속 성공! 사과 1개 획득!');else alert('오늘 할 일 모두 승인 완료!')}else if(!complete&&d.complete){d.complete=false;d.rewarded=false} }
function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function row(text,cls=''){let n=el('div',undefined,'entry '+cls);n.append(el('span',text));return n}
function btn(text,fn,cls=''){let b=el('button',text,cls);b.type='button';b.onclick=fn;return b}
function empty(node,text){node.append(el('p',text,'muted'))}
function render(){let k=localDay(),d=day(k),s=status();$('counter').textContent=`🍎 사과 ${s.apples}개 · 연속 성공 ${s.streak}일`;
let kt=$('kidTasks');kt.replaceChildren();if(!data.tasks.length)empty(kt,'부모 화면에서 할 일을 추가해 주세요.');
for(const t of data.tasks){let a=d.approved.includes(t.id),p=d.pending.includes(t.id),c=d.cancels.includes(t.id);let n=row(`${a?'✅':p?'⏳':'⬜'} ${t.name}`,a?'approved':p?'wait':'');if(c)n.append(el('span','취소 요청 중','muted'));else if(a)n.append(btn('취소 요청',()=>{if(confirm('승인된 체크의 취소를 부모님에게 요청할까요?')){d.cancels.push(t.id);save();render()}},'danger'));else if(p)n.append(btn('요청 취소',()=>{d.pending=d.pending.filter(id=>id!==t.id);save();render()},'danger'));else n.append(btn('했어요',()=>{d.pending.push(t.id);save();render()},'ok'));kt.append(n)}
let badge=$('badges');badge.replaceChildren();if(!data.badges.length)empty(badge,'아직 배지가 없어요.');for(const b of data.badges)badge.append(el('span',`🏅 ${b.name} · ${b.date}`,'badge'));
let kr=$('kidRewards');kr.replaceChildren();for(const r of data.rewards){let n=row(`${r.name} · 🍎 ${r.cost}개`);let b=btn('교환',()=>{if(!confirm(`${r.name}에 사과 ${r.cost}개를 사용할까요?`))return;if(status().apples<r.cost)return alert('사과가 부족해요.');data.badges.unshift({name:r.name,cost:r.cost,date:k});save();render()},'ok');b.disabled=s.apples<r.cost;n.append(b);kr.append(n)}
$('kid').classList.toggle('hidden',tab!=='kid');$('parent').classList.toggle('hidden',tab!=='parent');$('kidTab').classList.toggle('selected',tab==='kid');$('parentTab').classList.toggle('selected',tab==='parent');$('login').classList.toggle('hidden',loggedIn);$('parentContent').classList.toggle('hidden',!loggedIn);
if(loggedIn)renderParent(d,k);
}
function renderParent(d,k){let p=$('pending');p.replaceChildren();$('pendingCount').textContent=`(${d.pending.length})`;if(!d.pending.length)empty(p,'승인 대기 없음');for(const id of d.pending){let t=data.tasks.find(x=>x.id===id);if(!t)continue;let n=row(t.name,'wait');n.append(btn('승인',()=>{d.pending=d.pending.filter(x=>x!==id);if(!d.approved.includes(id))d.approved.push(id);checkDay(k);save();render()},'ok'),btn('거절',()=>{d.pending=d.pending.filter(x=>x!==id);save();render()},'danger'));p.append(n)}
let c=$('cancels');c.replaceChildren();if(!d.cancels.length)empty(c,'취소 요청 없음');for(const id of d.cancels){let t=data.tasks.find(x=>x.id===id);if(!t)continue;let n=row(t.name,'wait');n.append(btn('취소 승인',()=>unapprove(id), 'ok'),btn('거절',()=>{d.cancels=d.cancels.filter(x=>x!==id);save();render()},'danger'));c.append(n)}
let a=$('approved');a.replaceChildren();if(!d.approved.length)empty(a,'승인된 할 일 없음');for(const id of d.approved){let t=data.tasks.find(x=>x.id===id);if(!t)continue;let n=row(t.name,'approved');n.append(btn('승인 취소',()=>unapprove(id),'danger'));a.append(n)}
let tm=$('manageTasks');tm.replaceChildren();for(const t of data.tasks){let n=row(t.name);n.append(btn('수정',()=>{let v=prompt('할 일 이름',t.name);if(v?.trim()){t.name=v.trim();save();render()}}),btn('삭제',()=>{if(!confirm('이 할 일을 삭제할까요?'))return;data.tasks=data.tasks.filter(x=>x.id!==t.id);for(const v of Object.values(data.days)){v.pending=v.pending.filter(x=>x!==t.id);v.approved=v.approved.filter(x=>x!==t.id);v.cancels=v.cancels.filter(x=>x!==t.id)}checkDay();save();render()},'danger'));tm.append(n)}
let rm=$('manageRewards');rm.replaceChildren();for(const r of data.rewards){let n=row(`${r.name} · 🍎 ${r.cost}개`);n.append(btn('수정',()=>{let v=prompt('보상 이름',r.name);if(v===null)return;let cost=prompt('필요한 사과 개수',r.cost);if(cost===null)return;if(!v.trim()||!Number.isInteger(Number(cost))||Number(cost)<1)return alert('이름과 1 이상의 정수를 입력해 주세요.');r.name=v.trim();r.cost=Number(cost);save();render()}),btn('삭제',()=>{if(!confirm('이 보상을 삭제할까요?'))return;data.rewards=data.rewards.filter(x=>x.id!==r.id);save();render()},'danger'));rm.append(n)}
let h=$('history');h.replaceChildren();let dates=Object.keys(data.days).filter(k=>data.days[k].complete).sort().reverse().slice(0,10);if(!dates.length)empty(h,'아직 성공 기록이 없어요.');for(const date of dates)h.append(el('div','✅ '+date));
}
function unapprove(id){let d=day();d.approved=d.approved.filter(x=>x!==id);d.cancels=d.cancels.filter(x=>x!==id);checkDay();save();render()}
function lockParent(){loggedIn=false;if(tab==='parent')tab='kid';render()}
$('kidTab').onclick=()=>{tab='kid';loggedIn=false;render()};$('parentTab').onclick=()=>{tab='parent';render()};$('loginBtn').onclick=()=>{if($('pin').value!==data.pin)return alert('비밀번호가 달라요.');loggedIn=true;$('pin').value='';render()};$('logoutBtn').onclick=lockParent;
$('addTask').onclick=()=>{let v=$('newTask').value.trim();if(!v)return;data.tasks.push({id:freshId(),name:v});$('newTask').value='';save();render()};
$('addReward').onclick=()=>{let v=$('newReward').value.trim(),cost=Number($('newCost').value);if(!v||!Number.isInteger(cost)||cost<1)return alert('보상 이름과 1 이상의 사과 개수를 입력해 주세요.');data.rewards.push({id:freshId(),name:v,cost});$('newReward').value='';save();render()};
$('changePin').onclick=()=>{let v=$('newPin').value.trim();if(v.length<4)return alert('4자리 이상 입력해 주세요.');data.pin=v;$('newPin').value='';save();alert('비밀번호를 변경했어요.')};
$('reset').onclick=()=>{if(!confirm('모든 할 일, 기록, 배지와 사과를 삭제할까요?'))return;data=structuredClone(DEFAULT);save();render()};
window.addEventListener('storage',e=>{if(e.key===KEY){data=normalize(read());render()}});
window.addEventListener('beforeunload',()=>{loggedIn=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)loggedIn=false});
render();
</script></body></html>
