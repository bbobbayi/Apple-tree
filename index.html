<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사과나무 🍎</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff4e5;color:#433226;font-family:system-ui,'Malgun Gothic',sans-serif}.wrap{max-width:540px;margin:auto;padding:16px}header,.card{background:white;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #0001}header{text-align:center}h1{margin:4px}h2{font-size:19px;margin:0 0 12px}p{line-height:1.5}nav{display:flex;gap:8px;margin-bottom:14px}button{font:inherit;border:0;border-radius:12px;padding:10px 13px;background:#f5dfc0;color:#483521;cursor:pointer}button:disabled{opacity:.5;cursor:default}.tab{flex:1}.selected,.main{background:#e74852;color:white}.main{width:100%;font-weight:700}.ok{background:#2d9754;color:white}.danger{background:#ffdddd;color:#9a2020}.entry{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;margin:8px 0;background:#fff4e5;border-radius:12px;overflow-wrap:anywhere}.entry>span{flex:1}.wait{background:#fff0bd}.approved{background:#e2f5e7}input{width:100%;font:inherit;padding:12px;margin-bottom:8px;border:1px solid #e5c799;border-radius:10px}.muted{color:#806b58;font-size:14px}.hidden{display:none!important}.badge{display:inline-block;background:#e5f6eb;border-radius:20px;padding:7px 10px;margin:3px;font-size:14px}.notice{background:#fff0bd;padding:12px;border-radius:12px;margin-bottom:14px}.close{background:#4a4a4a;color:white;width:100%;font-weight:700}.historyItem{background:#fff8ec;border-radius:14px;padding:12px;margin-bottom:10px}.historyItem strong{display:block;margin-bottom:6px}</style></head><body><div class="wrap"><header><div style="font-size:50px">🌳</div><h1>사과나무</h1><div id="counter"></div><div id="today" class="muted"></div></header><div id="storageWarning" class="notice hidden"></div><nav><button id="kidTab" class="tab selected">아이 화면</button><button id="parentTab" class="tab">부모 승인</button></nav><section id="kid"><div class="card"><h2>🌅 아침 필수 할 일</h2><div id="morningKid"></div></div><div class="card"><h2>🌙 저녁 필수 할 일</h2><div id="eveningKid"></div></div><div class="card"><h2>⭐ 선택 할 일 · 5개 이상</h2><div id="optionalKid"></div><p class="muted">아침·저녁은 등록된 항목을 모두, 선택은 그중 5개 이상 부모님이 승인하면 오늘 성공!</p></div><div class="card"><h2>내 배지</h2><div id="badges"></div></div><div class="card"><h2>사과로 바꾸기</h2><div id="kidRewards"></div></div></section><section id="parent" class="hidden"><div id="login" class="card"><h2>부모 비밀번호</h2><input id="pin" type="password" inputmode="numeric" placeholder="처음 비밀번호 1234"><button id="loginBtn" class="main">로그인</button></div><div id="parentContent" class="hidden"><div class="card"><button id="logoutBtn" class="close">🔒 부모 화면 닫기</button><p class="muted">아이 화면으로 이동하거나 앱을 나가면 자동으로 잠겨요.</p></div><div class="card"><h2>오늘 승인 대기 <span id="pendingCount"></span></h2><div id="pending"></div></div><div class="card"><h2>오늘 취소 요청</h2><div id="cancels"></div></div><div class="card"><h2>오늘 승인된 할 일</h2><div id="approved"></div></div><div class="card"><h2>🌅 아침 필수 관리</h2><input id="newMorning" placeholder="새 아침 필수 할 일"><button id="addMorning" class="main">아침 필수 추가</button><div id="morningManage"></div></div><div class="card"><h2>🌙 저녁 필수 관리</h2><input id="newEvening" placeholder="새 저녁 필수 할 일"><button id="addEvening" class="main">저녁 필수 추가</button><div id="eveningManage"></div></div><div class="card"><h2>⭐ 선택 할 일 관리</h2><input id="newTask" placeholder="새 선택 할 일"><button id="addTask" class="main">선택 할 일 추가</button><div id="optionalManage"></div></div><div class="card"><h2>보상 관리</h2><input id="newReward" placeholder="새 보상"><input id="newCost" type="number" min="1" value="3" placeholder="필요한 사과"><button id="addReward" class="main">보상 추가</button><div id="manageRewards"></div></div><div class="card"><h2>날짜별 기록 · 날짜를 눌러보세요</h2><div id="history"></div></div><div class="card"><h2>설정</h2><input id="newPin" type="password" placeholder="새 비밀번호 (4자리 이상)"><button id="changePin">비밀번호 변경</button><button id="reset" class="danger">모든 데이터 초기화</button></div></div></section></div><script>
'use strict';
const KEY='appleTreeAppV14',OLD_KEYS=['appleTreeAppV13','appleTreeAppV12','appleTreeAppV11','appleTreeAppV10','appleTreeAppV9','appleTreeAppV8','appleTreeAppV7','appleTreeAppV6','appleTreeAppV5','appleTreeAppV4'];
const MORNING=['웃으며 일어나기','이불 정리하기','세수·양치하기','옷 입기','걸어서 유치원 버스 타기'];
const EVENING=['집에 오면 신발 정리하기','손 씻기','옷 빨래통에 넣기','잘 준비하기 (세수·양치·샤워)','밤 10시 30분까지 방에 눕기'];
const makeFixed=(list,prefix)=>list.map((name,i)=>({id:prefix+i,name}));
const DEFAULT=()=>({morning:makeFixed(MORNING,'morning-'),evening:makeFixed(EVENING,'evening-'),tasks:[],rewards:[{id:'r1',name:'아이스크림 먹기',cost:3},{id:'r2',name:'공원 놀러가기',cost:5}],days:{},badges:[],pin:'1234',legacyApples:0});
const $=id=>document.getElementById(id);
const localDay=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const previousDay=k=>{let [y,m,d]=k.split('-').map(Number);return localDay(new Date(y,m-1,d-1))};
let loggedIn=false,tab='kid',openDate=null;
function readKey(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function normalized(x){if(!x||typeof x!=='object')return DEFAULT();let oldTasks=(Array.isArray(x.tasks)?x.tasks:[]).map((t,i)=>typeof t==='string'?{id:'legacy-'+i,name:t}:t).filter(t=>t&&t.id&&typeof t.name==='string');let morning=Array.isArray(x.morning)?x.morning:makeFixed(MORNING,'morning-'),evening=Array.isArray(x.evening)?x.evening:makeFixed(EVENING,'evening-'),oldRequired=Array.isArray(x.required)?x.required:[];let tasks=x.morning?oldTasks:oldTasks.filter(t=>!oldRequired.some(r=>r.id===t.id));if(!x.morning)tasks=[...tasks,...oldRequired.filter(r=>r&&r.id&&r.name&&!tasks.some(t=>t.id===r.id))];tasks=tasks.filter(t=>![...morning,...evening].some(f=>f.name===t.name));let days=x.days&&typeof x.days==='object'?x.days:{};if(!x.days){let dates=new Set([...Object.keys(x.pending||{}),...Object.keys(x.approved||{}),...Object.keys(x.cancelRequests||{}),...Object.keys(x.records||{})]);for(let k of dates){let ids=a=>(Array.isArray(a)?a:[]).map(i=>oldTasks[i]?.id).filter(Boolean);days[k]={pending:ids(x.pending?.[k]),approved:ids(x.approved?.[k]),cancels:ids(x.cancelRequests?.[k]),complete:!!x.records?.[k],rewarded:false}}}for(let d of Object.values(days))for(let a of ['pending','approved','cancels'])d[a]=Array.isArray(d[a])?d[a]:[];return {morning,evening,tasks,rewards:(Array.isArray(x.rewards)?x.rewards:DEFAULT().rewards).map((r,i)=>({...r,id:r.id||'legacy-r-'+i})),days,badges:Array.isArray(x.badges)?x.badges:[],pin:String(x.pin||'1234'),legacyApples:Number(x.legacyApples??x.apples??0)};}
let raw=readKey(KEY),data;if(raw)data=normalized(raw);else{let old=null;for(let k of OLD_KEYS){old=readKey(k);if(old)break}data=normalized(old);if(old)try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){$('storageWarning').textContent='저장이 차단됐어요. 크롬이나 삼성 인터넷 일반 탭에서 열어주세요.';$('storageWarning').classList.remove('hidden');return false}}
function day(k=localDay()){let d=data.days[k]||(data.days[k]={pending:[],approved:[],cancels:[],complete:false,rewarded:false});for(let a of ['pending','approved','cancels'])d[a]=Array.isArray(d[a])?d[a]:[];return d}
function allTasks(){return [...data.morning,...data.evening,...data.tasks]}
function freshId(){return Date.now()+'-'+Math.random().toString(36).slice(2)}
function validToday(d){return [...data.morning,...data.evening].every(t=>d.approved.includes(t.id))&&data.tasks.filter(t=>d.approved.includes(t.id)).length>=5}
function streakAt(k){let count=0;while(data.days[k]?.complete){count++;k=previousDay(k)}return count}
function status(){let k=localDay();if(!data.days[k]?.complete)k=previousDay(k);let earned=Object.values(data.days).reduce((n,d)=>n+Number(!!d.rewarded&&!!d.complete),0),used=data.badges.reduce((n,b)=>n+Number(b.cost||0),0);return {streak:streakAt(k),apples:Math.max(0,earned+Number(data.legacyApples||0)-used)}}
function checkDay(k=localDay()){let d=day(k),valid=validToday(d);if(valid&&!d.complete){d.complete=true;d.rewarded=streakAt(k)%3===0;alert(d.rewarded?'🎉 3일 연속 성공! 사과 1개 획득!':'아침·저녁 필수 전체 + 선택 5개 승인 완료!')}else if(!valid&&d.complete){d.complete=false;d.rewarded=false}}
function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function row(text,cls=''){let n=el('div',undefined,'entry '+cls);n.append(el('span',text));return n}
function btn(text,fn,cls=''){let n=el('button',text,cls);n.type='button';n.onclick=fn;return n}
function empty(node,text){node.append(el('p',text,'muted'))}
function taskRows(node,tasks,d){node.replaceChildren();if(!tasks.length)empty(node,'등록된 할 일이 없어요.');for(let t of tasks){let a=d.approved.includes(t.id),p=d.pending.includes(t.id),c=d.cancels.includes(t.id),n=row(`${a?'✅':p?'⏳':'⬜'} ${t.name}`,a?'approved':p?'wait':'');if(c)n.append(el('span','취소 요청 중','muted'));else if(a)n.append(btn('취소 요청',()=>{if(confirm('부모님에게 승인 취소를 요청할까요?')){d.cancels.push(t.id);save();render()}},'danger'));else if(p)n.append(btn('요청 취소',()=>{d.pending=d.pending.filter(id=>id!==t.id);save();render()},'danger'));else n.append(btn('했어요',()=>{d.pending.push(t.id);save();render()},'ok'));node.append(n)}}
function render(){let k=localDay(),d=day(k),s=status();$('counter').textContent=`🍎 사과 ${s.apples}개 · 연속 성공 ${s.streak}일`;$('today').textContent=`오늘: ${k} · 매일 자정에 새로 시작`;taskRows($('morningKid'),data.morning,d);taskRows($('eveningKid'),data.evening,d);taskRows($('optionalKid'),data.tasks,d);let badge=$('badges');badge.replaceChildren();if(!data.badges.length)empty(badge,'아직 배지가 없어요.');for(let b of data.badges)badge.append(el('span',`🏅 ${b.name} · ${b.date}`,'badge'));let kr=$('kidRewards');kr.replaceChildren();for(let r of data.rewards){let n=row(`${r.name} · 🍎 ${r.cost}개`),b=btn('교환',()=>{if(!confirm(`${r.name}에 사과 ${r.cost}개를 사용할까요?`))return;if(status().apples<r.cost)return alert('사과가 부족해요.');data.badges.unshift({name:r.name,cost:r.cost,date:k});save();render()},'ok');b.disabled=s.apples<r.cost;n.append(b);kr.append(n)}$('kid').classList.toggle('hidden',tab!=='kid');$('parent').classList.toggle('hidden',tab!=='parent');$('kidTab').classList.toggle('selected',tab==='kid');$('parentTab').classList.toggle('selected',tab==='parent');$('login').classList.toggle('hidden',loggedIn);$('parentContent').classList.toggle('hidden',!loggedIn);if(loggedIn)renderParent(d,k)}
function renderHistory(){let h=$('history');h.replaceChildren();let dates=Object.keys(data.days).filter(k=>data.days[k].complete||data.days[k].approved.length||data.days[k].pending.length).sort().reverse().slice(0,14);if(!dates.length)empty(h,'아직 기록이 없어요.');for(let date of dates){let d=data.days[date],item=el('div',undefined,'historyItem');item.append(el('strong',`${date} ${d.complete?'✅ 성공':'⏳ 진행 중'}`));let groups=[['🌅 아침',data.morning],['🌙 저녁',data.evening],['⭐ 선택',data.tasks]];for(let [label,list] of groups){let done=list.filter(t=>d.approved.includes(t.id)).length;item.append(el('div',`${label} ${done}/${list.length}`));if(openDate===date)for(let t of list){let mark=d.approved.includes(t.id)?'✅':d.pending.includes(t.id)?'⏳':'⬜';item.append(el('div',`${mark} ${t.name}`,'muted'))}}item.append(btn(openDate===date?'날짜 닫기':'날짜 열기',()=>{openDate=openDate===date?null:date;render()}));h.append(item)}}
function renderParent(d,k){let p=$('pending');p.replaceChildren();$('pendingCount').textContent=`(${d.pending.length})`;if(!d.pending.length)empty(p,'승인 대기 없음');for(let id of d.pending){let t=allTasks().find(x=>x.id===id);if(!t)continue;let n=row(t.name,'wait');n.append(btn('승인',()=>{d.pending=d.pending.filter(x=>x!==id);if(!d.approved.includes(id))d.approved.push(id);checkDay(k);save();render()},'ok'),btn('거절',()=>{d.pending=d.pending.filter(x=>x!==id);save();render()},'danger'));p.append(n)}let c=$('cancels');c.replaceChildren();if(!d.cancels.length)empty(c,'취소 요청 없음');for(let id of d.cancels){let t=allTasks().find(x=>x.id===id);if(!t)continue;let n=row(t.name,'wait');n.append(btn('취소 승인',()=>unapprove(id),'ok'),btn('거절',()=>{d.cancels=d.cancels.filter(x=>x!==id);save();render()},'danger'));c.append(n)}let a=$('approved');a.replaceChildren();if(!d.approved.length)empty(a,'승인된 할 일 없음');for(let id of d.approved){let t=allTasks().find(x=>x.id===id);if(!t)continue;let n=row(t.name,'approved');n.append(btn('승인 취소',()=>unapprove(id),'danger'));a.append(n)}
function manage(node,arr){node.replaceChildren();if(!arr.length)empty(node,'아직 등록된 할 일이 없어요.');for(let t of arr){let n=row(t.name);n.append(btn('수정',()=>{let v=prompt('할 일 이름',t.name);if(v?.trim()){t.name=v.trim();save();render()}}),btn('삭제',()=>{if(!confirm('할 일을 삭제할까요?'))return;let i=arr.findIndex(x=>x.id===t.id);if(i<0)return;arr.splice(i,1);for(let d of Object.values(data.days))for(let a of ['pending','approved','cancels'])d[a]=(d[a]||[]).filter(x=>x!==t.id);checkDay();save();render()},'danger'));node.append(n)}}manage($('morningManage'),data.morning);manage($('eveningManage'),data.evening);manage($('optionalManage'),data.tasks);
let rm=$('manageRewards');rm.replaceChildren();for(let r of data.rewards){let n=row(`${r.name} · 🍎 ${r.cost}개`);n.append(btn('수정',()=>{let v=prompt('보상 이름',r.name);if(v===null)return;let cost=prompt('필요한 사과 개수',r.cost);if(cost===null)return;if(!v.trim()||!Number.isInteger(Number(cost))||Number(cost)<1)return alert('이름과 1 이상의 정수를 입력해 주세요.');r.name=v.trim();r.cost=Number(cost);save();render()}),btn('삭제',()=>{if(!confirm('보상을 삭제할까요?'))return;data.rewards=data.rewards.filter(x=>x.id!==r.id);save();render()},'danger'));rm.append(n)}renderHistory()}
function unapprove(id){let d=day();d.approved=d.approved.filter(x=>x!==id);d.cancels=d.cancels.filter(x=>x!==id);checkDay();save();render()}
function lockParent(){loggedIn=false;tab='kid';render()}
$('kidTab').onclick=()=>{tab='kid';loggedIn=false;render()};$('parentTab').onclick=()=>{tab='parent';render()};$('loginBtn').onclick=()=>{if($('pin').value!==data.pin)return alert('비밀번호가 달라요.');loggedIn=true;$('pin').value='';render()};$('logoutBtn').onclick=lockParent;
function add(which,id){let v=$(id).value.trim();if(!v)return;data[which].push({id:freshId(),name:v});$(id).value='';save();render()}
$('addMorning').onclick=()=>add('morning','newMorning');$('addEvening').onclick=()=>add('evening','newEvening');$('addTask').onclick=()=>add('tasks','newTask');
$('addReward').onclick=()=>{let v=$('newReward').value.trim(),cost=Number($('newCost').value);if(!v||!Number.isInteger(cost)||cost<1)return alert('보상 이름과 1 이상의 사과 개수를 입력해 주세요.');data.rewards.push({id:freshId(),name:v,cost});$('newReward').value='';save();render()};
$('changePin').onclick=()=>{let v=$('newPin').value.trim();if(v.length<4)return alert('4자리 이상 입력해 주세요.');data.pin=v;$('newPin').value='';save();alert('비밀번호를 변경했어요.')};$('reset').onclick=()=>{if(!confirm('할 일, 기록, 배지와 사과를 모두 삭제할까요?'))return;data=DEFAULT();save();render()};window.addEventListener('storage',e=>{if(e.key===KEY){data=normalized(readKey(KEY));render()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)loggedIn=false});render();
</script></body></html>
